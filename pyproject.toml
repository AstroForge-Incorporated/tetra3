[build-system]
requires = ["uv_build>=0.7.2,<0.8"]
build-backend = "uv_build"

[project]
name = "tetra3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.1",
    "pillow>=8.3.1",
    "scipy>=1.7.1",
]

[project.scripts]
tetra3-generate-db = "tetra3.generate_database:main"
tetra3-generate-stars = "tetra3.generate_stars:main"

[tool.uv.build-backend]
module-root = ""
